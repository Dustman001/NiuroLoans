services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Loans_Dev_Pass123!"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  events-api:
    build: ./events-api
    ports:
      - "4000:4000"
    volumes:
      - ./events-api/data:/data

  api:
    build: ./api
    environment:
      ConnectionStrings__Loans: "Server=sqlserver,1433;Database=Loans;User Id=sa;Password=Loans_Dev_Pass123!;TrustServerCertificate=True"
      EventsApi__BaseUrl: "http://events-api:4000"
    ports:
      - "5000:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      events-api:
        condition: service_started

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:5000"
    ports:
      - "3000:3000"
    depends_on:
      - api
